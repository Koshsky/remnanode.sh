# Шаблон инвентаря: скопировать в hosts.ini и заполнить (hosts.ini в .gitignore).
#
# Первый запуск новой машины:
#   - пароли у всех хостов одинаковые: ansible-playbook playbooks/provision.yml -k
#   - пароли разные: вписать ansible_password в каждой строке (как ниже) и
#     запускать БЕЗ -k:  ansible-playbook playbooks/provision.yml
#       (ключ пробуется первым; если у хоста ключ уже есть — пароль не нужен)
# Повторные запуски: без пароля — root по ключу из keys/<host>/id_ed25519
# (ключи генерируются автоматически при первом запуске и кладутся в authorized_keys
# и root, и создаваемого пользователя). После первого успешного прогона строки
# ansible_password можно удалить из hosts.ini или перевести секреты на ansible-vault.
#
# hostname ноды = имя хоста в инвентаре (node-01);
# DOMAIN = <hostname>.<DOMAIN_ZONE> из inventory/group_vars/all/vars.yml.
#
# Путь к ключу ноды задаётся ОДИН РАЗ для всего парка в
# inventory/group_vars/remnanodes.yml (ansible_ssh_private_key_file через
# inventory_dir — работает из любого каталога, и для ad-hoc, и для playbook'ов).
# После первого прогона парольный вход закрыт (sshd hardened) — ключ обязателен.

[remnanodes]
node-01 ansible_host=203.0.113.1 ansible_user=root ansible_password='CHANGE_ME'
node-02 ansible_host=1.2.3.4 ansible_user=root ansible_password='CHANGE_ME'