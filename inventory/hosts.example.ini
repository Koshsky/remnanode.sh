# Шаблон инвентаря: скопировать в hosts.ini и заполнить (hosts.ini в .gitignore).
#
# Первый запуск новой машины: ansible-playbook -k provision.yml  (спросит root-пароль)
# Повторные запуски: без -k — подключение root по ключу из keys/<host>/id_ed25519
# (ключи генерируются автоматически при первом запуске и кладутся в authorized_keys
# и root, и создаваемого пользователя).
#
# hostname ноды = имя хоста в инвентаре (node-01);
# DOMAIN = <hostname>.<DOMAIN_ZONE> из group_vars/all/vars.yml.

[node-01]
node-01 ansible_host=203.0.113.1 ansible_user=root

[node-02]
node-02 ansible_host=1.2.3.4 ansible_user=root

[remnanodes:children]
node-01
node-02