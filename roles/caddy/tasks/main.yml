---
# Caddy на узле: landing-страница и /health за xray (unix-сокет, PROXY protocol),
# сертификаты Caddy выпускает сам (ACME). Заменяет nginx + certbot + renew-cron.
#
# Контейнер управляется через docker run (без docker compose): на этих хостах
# compose v2 стабильно падал в "container name already in use" на собственном
# пересоздании (баговое поведение с host-network/created-state), docker run —
# детерминировано.

- name: Каталог /opt/caddy
  ansible.builtin.file:
    path: /opt/caddy
    state: directory
    mode: "0755"

- name: Убрать старый nginx-контейнер и сокет (переезд с nginx на caddy)
  ansible.builtin.shell: "docker rm -f nginx 2>/dev/null; rm -f /dev/shm/nginx.sock 2>/dev/null; true"
  changed_when: false

- name: Убрать любые предыдущие контейнеры проекта caddy (compose-осколки и docker run)
  ansible.builtin.shell: |
    docker rm -f caddy 2>/dev/null
    docker rm -f $(docker ps -aq --filter label=com.docker.compose.project=caddy 2>/dev/null) 2>/dev/null
    true
  changed_when: false

- name: Статика приложения
  ansible.builtin.copy:
    src: app/
    dest: /opt/caddy/app/
    mode: "0644"

- name: Caddyfile из шаблона ({{ DOMAIN }})
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /opt/caddy/Caddyfile
    mode: "0644"
  notify: restart caddy container

- name: Поднять контейнер caddy (docker run)
  ansible.builtin.shell: |
    if ! docker ps -q --filter name=^/caddy$ >/dev/null; then
      docker run -d --name caddy --restart unless-stopped --network host \
        -v /opt/caddy/Caddyfile:/etc/caddy/Caddyfile:ro \
        -v /opt/caddy/app:/var/www/html:ro \
        -v /opt/caddy/caddy_data:/data \
        -v /opt/caddy/caddy_config:/config \
        -v /dev/shm:/dev/shm \
        caddy:2-alpine
    fi
  register: caddy_run
  changed_when: caddy_run.stdout | length > 0

- name: Контейнер caddy поднялся? (иначе — логи для диагностики)
  ansible.builtin.shell: |
    for i in $(seq 1 15); do
      docker ps --filter name=^/caddy$ --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx caddy && exit 0
      sleep 2
    done
    echo '--- docker ps -a ---'
    docker ps -a --filter name=caddy
    echo '--- docker logs caddy ---'
    docker logs caddy 2>&1 | tail -40
    exit 1
  register: caddy_watch
  changed_when: false