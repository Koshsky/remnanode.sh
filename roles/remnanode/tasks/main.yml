---
# RemnaNode (/opt/remnanode): compose из шаблона + zapret cron.

- name: Каталог /opt/remnanode
  ansible.builtin.file:
    path: /opt/remnanode
    state: directory
    mode: "0755"

- name: docker-compose из шаблона (порт + секрет)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/remnanode/docker-compose.yml
    mode: "0644"
  notify: restart remnanode container

- name: Каталоги томов
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /var/log/remnanode
    - /opt/remnawave/xray/share

- name: cron — обновление zapret.dat (02:00/14:00)
  ansible.builtin.cron:
    name: zapret update
    minute: "0"
    hour: "2,14"
    job: "wget -q --timeout=30 -T 30 -O /opt/remnawave/xray/share/zapret.dat https://github.com/kutovoys/ru_gov_zapret/releases/latest/download/zapret.dat"

# zapret.dat монтируется в контейнер КАК ФАЙЛ; на свежей ноде файла нет, и docker
# создал бы пустой КАТАЛОГ → контейнер не стартует. Скачиваем ДО compose up;
# при недоступности GitHub гарантируем пустой файл (cron обновит позже).
- name: zapret.dat — скачать до старта контейнера
  ansible.builtin.get_url:
    url: https://github.com/kutovoys/ru_gov_zapret/releases/latest/download/zapret.dat
    dest: /opt/remnawave/xray/share/zapret.dat
    mode: "0644"
  ignore_errors: true

- name: zapret.dat — гарантировать файл (пустой, если GitHub недоступен)
  ansible.builtin.copy:
    content: ""
    dest: /opt/remnawave/xray/share/zapret.dat
    mode: "0644"
    force: false

- name: remnanode контейнер (docker compose up)
  community.docker.docker_compose_v2:
    project_src: /opt/remnanode
    state: present