---
# RemnaNode (/opt/remnanode): compose из шаблона + zapret cron.

- name: Каталог /opt/remnanode
  ansible.builtin.file:
    path: /opt/remnanode
    state: directory
    mode: "0755"

- name: docker-compose из шаблона (порт + секрет)
  ansible.builtin.template:
    src: docker-compose.yml.j2
    dest: /opt/remnanode/docker-compose.yml
    mode: "0644"

- name: Каталоги томов
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - /var/log/remnanode
    - /opt/remnawave/xray/share

# Атомарно: качаем во временный файл, только при успехе mv поверх боевого;
# при сбое старый файл (обе секции) сохраняется, tmp удаляется.
- name: cron — обновление zapret.dat (02:00/14:00, атомарно)
  ansible.builtin.cron:
    name: zapret update
    minute: "0"
    hour: "2,14"
    job: "wget -q --timeout=30 -T 30 -O /opt/remnawave/xray/share/.zapret.dat.tmp https://github.com/kutovoys/ru_gov_zapret/releases/latest/download/zapret.dat && mv -f /opt/remnawave/xray/share/.zapret.dat.tmp /opt/remnawave/xray/share/zapret.dat || rm -f /opt/remnawave/xray/share/.zapret.dat.tmp"

# zapret.dat монтируется в контейнер КАК ФАЙЛ; на свежей ноде файла нет, и docker
# создал бы пустой КАТАЛОГ → контейнер не стартует. Скачиваем ДО compose up;
# при недоступности GitHub гарантируем пустой файл (cron обновит позже).
- name: zapret.dat — скачать до старта контейнера
  ansible.builtin.get_url:
    url: https://github.com/kutovoys/ru_gov_zapret/releases/latest/download/zapret.dat
    dest: /opt/remnawave/xray/share/zapret.dat
    mode: "0644"
  ignore_errors: true

- name: zapret.dat — гарантировать файл (пустой, если GitHub недоступен)
  ansible.builtin.copy:
    content: ""
    dest: /opt/remnawave/xray/share/zapret.dat
    mode: "0644"
    force: false

- name: ip-zapret.dat — удалить (не используется)
  ansible.builtin.file:
    path: "/opt/remnawave/xray/share/ip-zapret.dat"
    state: absent

# compose v2 + явный container_name: если остался контейнер remnanode в состоянии
# created/exited/dead (прерванный прошлый up/конфликт) — «name already in use» при
# пересоздании. Чистим НЕ-работающие, затем поднимаем с retry-на-конфликт.
- name: remnanode — убрать зависшие контейнеры (created/exited/dead)
  ansible.builtin.shell: |
    for c in $(docker ps -aq --filter name=^/remnanode$ --filter status=created --filter status=exited --filter status=dead 2>/dev/null); do
      docker rm -f "$c" >/dev/null 2>&1 || true
    done
  changed_when: false

- name: remnanode контейнер (compose up, retry-на-конфликт)
  ansible.builtin.shell: |
    cd /opt/remnanode
    for i in 1 2 3; do
      if docker compose up -d >/dev/null 2>&1; then exit 0; fi
      # конфликт имени/зависшее состояние: убрать и повторить
      for c in $(docker ps -aq --filter name=^/remnanode$ 2>/dev/null); do docker rm -f "$c" >/dev/null 2>&1 || true; done
      sleep 2
    done
    echo "remnanode не поднялся за 3 попытки" >&2
    docker ps -a --filter name=remnanode
    docker logs remnanode 2>&1 | tail -20
    exit 1
  changed_when: false