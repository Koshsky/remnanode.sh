---
# Базовая настройка: hostname, обновления, пакеты, unattended-upgrades.

- name: Установка hostname из имени хоста инвентаря
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"
  when: inventory_hostname != 'localhost'

- name: cloud-init — preserve hostname (не сбрасывать при перезагрузках)
  ansible.builtin.copy:
    src: 99-preserve-hostname.cfg
    dest: /etc/cloud/cloud.cfg.d/99-preserve-hostname.cfg
    mode: "0644"

- name: /etc/hosts — 127.0.1.1 (Ubuntu-соглашение, иначе "Unable to resolve host")
  ansible.builtin.lineinfile:
    path: /etc/hosts
    line: "127.0.1.1 {{ inventory_hostname }}"
    insertbefore: EOF
  when: inventory_hostname != 'localhost'

- name: "Дождаться завершения чужих apt-процессов (dpkg lock: unattended-upgrades и т.п.)"
  ansible.builtin.shell: |
    timeout 900 bash -c 'until ! fuser /var/lib/dpkg/lock-frontend >/dev/null 2>&1 && ! fuser /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 5; done'
  changed_when: false

- name: apt update
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 900

# Ручной прогон playbook = осознанное полное обновление системы (включая ядра из -updates).
# Автоматический режим — только security (unattended-upgrades, см. 20auto-upgrades/99-оверрайд).
- name: Полное обновление системы
  ansible.builtin.apt:
    upgrade: full
    update_cache: true
    lock_timeout: 900

- name: Базовые пакеты
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - wget
      - gnupg
      - apt-transport-https
      - cron
      - gettext-base
      - openssh-server
      - sudo
      - unattended-upgrades
      - fail2ban
      - ufw
      - certbot
      - python3
    state: present
    lock_timeout: 900

- name: "unattended-upgrades — конфиг (флаг из vars: 1 — вкл, 0 — выкл)"
  ansible.builtin.template:
    src: 20auto-upgrades.j2
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: unattended-upgrades — security-only оверрайд (без авто-перезагрузки)
  ansible.builtin.template:
    src: 99unattended-upgrades-security-only.j2
    dest: /etc/apt/apt.conf.d/99unattended-upgrades-security-only
    mode: "0644"
  when: UNATTENDED_UPGRADES

- name: unattended-upgrades — убрать security-only оверрайд при отключении
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99unattended-upgrades-security-only
    state: absent
  when: not UNATTENDED_UPGRADES

- name: Таймеры автоматических обновлений
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: "{{ UNATTENDED_UPGRADES }}"
    state: "{{ 'started' if UNATTENDED_UPGRADES else 'stopped' }}"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  ignore_errors: true