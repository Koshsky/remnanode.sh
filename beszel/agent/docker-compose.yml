# Beszel agent — ставится на каждую remnanode и пушит метрики на hub.
# Плейсхолдеры ${KEY}/${HUB_URL}/${TOKEN} подставляет setup.sh через envsubst
# из .env узла. Сеть агента — host, наружу ходит только исходящими к hub.
# Документация: https://beszel.dev/guide/agent-installation

services:
  beszel-agent:
    image: henrygd/beszel-agent
    container_name: beszel-agent
    restart: always
    network_mode: host
    volumes:
      - ./beszel_agent_data:/var/lib/beszel-agent
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      LISTEN: ${BESZEL_AGENT_PORT}
      KEY: ${BESZEL_AGENT_KEY}
      HUB_URL: ${BESZEL_HUB_URL}
      TOKEN: ${BESZEL_TOKEN}
    healthcheck:
      test: ['CMD', '/agent', 'health']
      interval: 120s
