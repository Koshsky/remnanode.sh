---
# Перевыпуск SSH-ключей для машин (восстановление доступа/ротация).
# Прогнать с любым рабочим доступом (пароль или существующий ключ).

- name: Перевыпуск ключей на контрольной машине
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Каталоги ключей
      ansible.builtin.file:
        path: "keys/{{ item }}"
        state: directory
      loop: "{{ groups['remnanodes'] | default([]) }}"

    - name: Генерация новой пары (force — перезапишет)
      community.crypto.openssh_keypair:
        path: "keys/{{ item }}/id_ed25519"
        type: ed25519
        comment: "ansible-remnanode-{{ item }}"
        force: true
      loop: "{{ groups['remnanodes'] | default([]) }}"

    - name: Хосты с новым ключом
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: provision
        ansible_ssh_private_key_file: "keys/{{ item }}/id_ed25519"
      loop: "{{ groups['remnanodes'] | default([]) }}"

- name: Установить новый ключ в authorized_keys
  hosts: provision
  become: true
  tasks:
    - name: root — новый ключ
      ansible.builtin.authorized_key:
        user: root
        key: "{{ lookup('file', playbook_dir ~ '/keys/' ~ inventory_hostname ~ '/id_ed25519.pub') }}"
        state: present

    - name: Пользователь — новый ключ
      ansible.builtin.authorized_key:
        user: "{{ NEW_USER_LOGIN }}"
        key: "{{ lookup('file', playbook_dir ~ '/keys/' ~ inventory_hostname ~ '/id_ed25519.pub') }}"
        state: present