---
# Ротация ЕДИНОГО park-ключа парка (playbooks/keys/park/id_ed25519).
# Безопасный порядок: бэкап старого ключа → генерация нового → новый pub
# УСТАНАВЛИВАЕТСЯ на все ноды (root + пользователь) ДО любых других действий.
# Старые pub в authorized_keys НЕ удаляются — остаются страховкой; очистка
# старых — отдельный осознанный шаг.
# Запуск: ansible-playbook -i inventory/hosts.ini playbooks/ops/rekey.yml
# Требуется рабочий доступ к нодам (старый park-ключ или пароль).

- name: Перевыпуск единого park-ключа на контрольной машине
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Каталог park
      ansible.builtin.file:
        path: "{{ playbook_dir }}/keys/park"
        state: directory
        mode: "0700"

    - name: Бэкап прежнего ключа (id_ed25519.old)
      ansible.builtin.shell: |
        [ -f "{{ playbook_dir }}/keys/park/id_ed25519" ] && cp -a "{{ playbook_dir }}/keys/park/id_ed25519" "{{ playbook_dir }}/keys/park/id_ed25519.old" || true
      changed_when: false

    - name: Генерация новой пары (force — перезапишет)
      community.crypto.openssh_keypair:
        path: "{{ playbook_dir }}/keys/park/id_ed25519"
        type: ed25519
        comment: "ansible-remnanode-park"
        force: true

    - name: Хосты с новым park-ключом
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: provision
        ansible_ssh_private_key_file: "{{ playbook_dir }}/keys/park/id_ed25519"
      loop: "{{ groups['remnanodes'] | default([]) }}"

- name: Установить новый парковый ключ в authorized_keys
  hosts: provision
  become: true
  tasks:
    - name: root — новый park-ключ
      ansible.builtin.authorized_key:
        user: root
        key: "{{ lookup('file', playbook_dir ~ '/keys/park/id_ed25519.pub') }}"
        state: present

    - name: Пользователь — новый park-ключ
      ansible.builtin.authorized_key:
        user: "{{ NEW_USER_LOGIN }}"
        key: "{{ lookup('file', playbook_dir ~ '/keys/park/id_ed25519.pub') }}"
        state: present