---
# Полная настройка новой remnanode (Ubuntu 24.04).
#
# Первый запуск:  ansible-playbook -i inventory/hosts.ini playbooks/provision.yml -k
#   (-k спросит root-пароль; ключи будут сгенерированы в keys/<host>/ и установлены
#   в authorized_keys для root и создаваемого пользователя).
# Повторные:      ansible-playbook -i inventory/hosts.ini playbooks/provision.yml
#   (root по ключу — пароль и парольный вход уже запрещены).

- name: Подготовка ключей на контрольной машине
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Каталоги ключей
      ansible.builtin.file:
        path: "keys/{{ item }}"
        state: directory
      loop: "{{ groups['remnanodes'] | default([]) }}"

    - name: Генерация ключевой пары (не перезаписывает существующую)
      community.crypto.openssh_keypair:
        path: "keys/{{ item }}/id_ed25519"
        type: ed25519
        comment: "ansible-remnanode-{{ item }}"
      loop: "{{ groups['remnanodes'] | default([]) }}"

    - name: Добавить хосты с путём к приватному ключу
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: provision
        ansible_ssh_private_key_file: "keys/{{ item }}/id_ed25519"
      loop: "{{ groups['remnanodes'] | default([]) }}"

- name: Настройка remnanode
  hosts: provision
  gather_facts: true
  become: true
  pre_tasks:
    - name: Проверка обязательных переменных
      ansible.builtin.assert:
        that:
          - NEW_USER_LOGIN | default('') | length > 0
          - NEW_USER_PASSWORD | default('') | length > 0
          - EMAIL | default('') | length > 0
          - REMNAWAVE_SECRET_KEY | default('') | length > 0
          - DOMAIN_ZONE | default('') | length > 0
          - DOMAIN | default('') | length > 0
          - (SSH_PORT | default('')) is match('^[0-9]+$')
          - (XRAY_PORT | default('')) is match('^[0-9]+$')
          - (REMNANODE_PORT | default('')) is match('^[0-9]+$')
          - (BESZEL_AGENT_PORT | default('')) is match('^[0-9]+$')
        fail_msg: "Заполните обязательные переменные в group_vars/all/vars.yml (в т.ч. DOMAIN_ZONE для автоподстановки DOMAIN); порты — числа"
  roles:
    - base
    - security
    - docker
    - certbot
    - nginx
    - remnanode
    - beszel
    - maintenance
  post_tasks:
    - name: Healthcheck — RemnaNode слушает порт {{ REMNANODE_PORT }}
      ansible.builtin.shell: "ss -tln | grep -q ' :{{ REMNANODE_PORT }} '"
      changed_when: false

    - name: Healthcheck — xray слушает порт {{ XRAY_PORT }}
      ansible.builtin.shell: "ss -tln | grep -q ' :{{ XRAY_PORT }} '"
      changed_when: false

    - name: Healthcheck — контейнеры nginx и remnanode запущены
      ansible.builtin.shell: |
        docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx nginx &&
        docker ps --format '{{ '{{' }}.Names{{ '}}' }}' | grep -qx remnanode
      changed_when: false

    - name: Healthcheck — https://{{ DOMAIN }}/health отвечает 200
      ansible.builtin.uri:
        url: "https://{{ DOMAIN }}/health"
        method: GET
        status_code: 200
        validate_certs: true
        timeout: 10

    - name: Healthcheck — итог
      ansible.builtin.debug:
        msg: "Все проверки пройдены: RemnaNode :{{ REMNANODE_PORT }}, xray :{{ XRAY_PORT }}, https://{{ DOMAIN }}/health=200"