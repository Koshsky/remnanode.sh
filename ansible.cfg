[defaults]
inventory = inventory/hosts.ini
roles_path = roles
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Первичная настройка свежих/пересозданных VPS: не проверяем host-ключи,
# иначе "REMOTE HOST IDENTIFICATION HAS CHANGED" блокирует подключения
# (IP переиспользуют новые машины). ВАЖНО: после сборки парка вернуть
# обычную проверку — убрать UserKnownHostsFile/StrictHostKeyChecking.
# ControlMaster/ControlPersist — держим ОДНО соединение на хост: иначе каждый
# таск открывает новый ssh (auth-раунды), и fail2ban (maxretry=3) банит
# контрольную машину прямо во время провижининга ("Connection timed out").
# IdentitiesOnly — ssh пробует ТОЛЬКО ключ из -i (иначе при MaxAuthTries=3 сервера
# перебор дефолтных identity-файлов рвёт подключение «Too many authentication failures»).
ssh_args = -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
           -o ControlMaster=auto -o ControlPersist=600s \
           -o ControlPath=/tmp/ansible-cp-%%h-%%p-%%r \
           -o IdentitiesOnly=yes